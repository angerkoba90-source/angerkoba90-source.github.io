<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Обновление DenisFit</title>
<style>
html,body{margin:0;min-height:100%;background:#090b0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Arial,sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(420px,100%);background:#101310;border:1px solid #2a302b;border-radius:22px;padding:22px;box-sizing:border-box;text-align:center}.brand{font-size:28px;font-weight:900}.brand span{color:#b7ff32}.status{margin-top:14px;color:#a5ada7;line-height:1.45}.spinner{width:42px;height:42px;border-radius:50%;border:4px solid #273027;border-top-color:#b7ff32;margin:22px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.small{font-size:12px;color:#737b75;margin-top:12px}
</style>
</head>
<body>
<div class="card"><div class="brand">Denis<span>Fit</span></div><div class="spinner"></div><div id="status" class="status">Удаляю старый кэш и обновляю DenisFit до 20.1…</div><div class="small">Данные клиентов, тренировки и вход не удаляются.</div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('denisfit-v')).map(k=>caches.delete(k)));
    }
    status.textContent='Готово. Открываю DenisFit 20.1…';
    await new Promise(r=>setTimeout(r,400));
    location.replace('/?release=20.1.0&fresh='+Date.now());
  }catch(e){
    console.error(e);
    status.textContent='Кэш очищен частично. Открываю приложение заново…';
    setTimeout(()=>location.replace('/?release=20.1.0&fresh='+Date.now()),800);
  }
})();
</script>
</body>
</html>
