name: DenisFit CI

on:
  push:
    branches:
      - main
      - denisfit-workout-diary-v188-hardening
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check trainer-diary-v188.js
          node --check trainer-progress-v190.js
          node --check client-workflow-v191.js
          node --check client-workflow-v192.js
          node --check client-card-v201.js
          node --check schedule-client-v208.js
          node --check schedule-template-ui-v210.js
          node --check nutrition-off-v203.js
          node --check client-directions-v205.js
          node --check client-personal-calendar-v207.js
          node --check program-template-v186.js
          node --check schedule-week-v185.js
          node --check schedule-collapse-v183.js
          node --check app.js
          node --check sw.js
      - name: Check DenisFit release wiring
        run: |
          grep -q 'client-directions-v205.js?v=20.5.0' index.html
          grep -q 'client-personal-calendar-v207.js?v=20.7.0' index.html
          grep -q 'schedule-client-v208.js?v=20.8.0' index.html
          grep -q 'schedule-template-ui-v210.js?v=20.10.0' index.html
          ! grep -q 'schedule-template-remove-v209.js?v=20.9.0' index.html
          ! grep -q 'schedule-client-v202.js?v=20.2.0' index.html
          ! grep -q 'client-calendar-v206.js?v=20.6.0' index.html
          grep -q '#dfdClientProgress{display:none!important}' index.html
          grep -q '>20.10</div>' index.html
          grep -q '/sw.js?v=20.10.0' index.html
          grep -q "denisfit-v20.10.0" sw.js
          grep -q 'schedule-client-v208.js?v=20.8.0' sw.js
          grep -q 'schedule-template-ui-v210.js?v=20.10.0' sw.js
          ! grep -q 'schedule-template-remove-v209.js?v=20.9.0' sw.js
          grep -q 'client-personal-calendar-v207.js?v=20.7.0' sw.js
          grep -q 'release=20.10.0' denisfit-update.html
      - name: Verify frozen standalone journal
        run: |
          while read -r expected path; do
            actual=$(git hash-object "$path")
            test "$actual" = "$expected" || { echo "Frozen journal changed: $path"; exit 1; }
          done < .github/journal-frozen-shas.txt
      - name: Install browser test dependency
        run: npm install --no-save playwright-core@1.55.0
      - name: Run mobile trainer diary integration test
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node .github/tests/trainer-diary-v188.spec.js
      - name: Run client workflow v191 integration test
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME_PATH" node .github/tests/client-workflow-v191.spec.js
      - name: Run direct client workflow v192 integration test
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME_PATH" node .github/tests/client-workflow-v192.spec.js
      - name: Run real-data client card v201 regression test
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME_PATH" node .github/tests/client-card-v201.spec.js
      - name: Run schedule template picker v208 integration test
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME_PATH" node .github/tests/schedule-client-v208.spec.js
      - name: Run schedule template UI v210 regression test
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME_PATH" node .github/tests/schedule-template-ui-v210.spec.js
      - name: Run nutrition removal v203 regression test
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME_PATH" node .github/tests/nutrition-off-v203.spec.js
      - name: Run client directions v205 integration test
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME_PATH" node .github/tests/client-directions-v205.spec.js
      - name: Run client personal calendar v207 integration test
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME_PATH" node .github/tests/client-personal-calendar-v207.spec.js
      - name: Run progression start-state test
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          CHROME_PATH="$CHROME_PATH" node .github/tests/trainer-progress-v190.spec.js
