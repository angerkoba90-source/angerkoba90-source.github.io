name: Validate DenisFit production v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-denisfit-production-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static production checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check vendor/supabase.min.js
          test "$(wc -c < app.js)" -gt 150000
          test "$(wc -c < styles.css)" -gt 40000
          test "$(wc -c < vendor/supabase.min.js)" -gt 100000
          grep -q 'signInAnonymously' app.js
          grep -q 'claim-invite' app.js
          grep -q 'create_client_pass' app.js
          grep -q 'Отправить ссылку' app.js
          ! grep -q 'Поделиться Pass' app.js
          grep -q '/styles.css?v=17.2.0' index.html
          grep -q '/app.js?v=17.2.0' index.html
          grep -q '/vendor/supabase.min.js?v=17.2.0' index.html

      - name: Wait for live production assets
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://angerkoba90-source.github.io/'
            'https://angerkoba90-source.github.io/app.js?v=17.2.0'
            'https://angerkoba90-source.github.io/styles.css?v=17.2.0'
            'https://angerkoba90-source.github.io/vendor/supabase.min.js?v=17.2.0'
            'https://angerkoba90-source.github.io/manifest.webmanifest?v=17.2.0'
            'https://angerkoba90-source.github.io/sw.js?v=17.2.0'
          )
          for u in "${urls[@]}"; do
            ok=0
            for i in $(seq 1 20); do
              if curl --fail --silent --show-error --location "$u" -o /dev/null; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = 1
          done

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Chromium E2E
        shell: bash
        env:
          JOIN_URL: https://angerkoba90-source.github.io/join/9f435a3f-277a-4cb7-a270-3052bdd4a2f0?v=e2e-1720-v2
        run: |
          cat > denisfit-e2e.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const report={version:'17.2.0',checked_at:new Date().toISOString(),status:'running',checks:{}};
          const pass=(n,d='ok')=>report.checks[n]={status:'pass',details:d};
          const fail=(n,e)=>report.checks[n]={status:'fail',details:String(e?.message||e)};
          let browser;
          try{
            browser=await chromium.launch({headless:true});

            const trainer=await browser.newContext();
            const tp=await trainer.newPage();
            const trainerErrors=[];
            tp.on('pageerror',e=>trainerErrors.push(`pageerror: ${e.message}`));
            tp.on('console',m=>{if(m.type()==='error')trainerErrors.push(`console: ${m.text()}`)});
            const rootResponse=await tp.goto('https://angerkoba90-source.github.io/?prod=1720-v2',{waitUntil:'networkidle',timeout:60000});
            if(!rootResponse||rootResponse.status()!==200)throw new Error(`root HTTP ${rootResponse?.status()}`);
            await tp.getByRole('button',{name:'Вход тренера'}).waitFor({state:'visible',timeout:20000});
            const bg=await tp.evaluate(()=>getComputedStyle(document.body).backgroundColor);
            if(!bg||bg==='rgba(0, 0, 0, 0)')throw new Error(`CSS not applied: ${bg}`);
            await tp.getByRole('button',{name:'Вход тренера'}).click();
            await tp.locator('#trainerAuthEmail').waitFor({state:'visible'});
            await tp.locator('#trainerAuthPassword').waitFor({state:'visible'});
            if(trainerErrors.length)throw new Error(trainerErrors.join(' | '));
            pass('trainer_landing','HTTP 200; styled UI; trainer login panel opens');
            await trainer.close();

            const client=await browser.newContext();
            const cp=await client.newPage();
            const clientErrors=[];
            cp.on('pageerror',e=>clientErrors.push(`pageerror: ${e.message}`));
            cp.on('console',m=>{if(m.type()==='error')clientErrors.push(`console: ${m.text()}`)});
            const joinResponse=await cp.goto(process.env.JOIN_URL,{waitUntil:'domcontentloaded',timeout:60000});
            if(!joinResponse||![200,404].includes(joinResponse.status()))throw new Error(`join HTTP ${joinResponse?.status()}`);
            const name=cp.locator('#stableJoinName');
            await name.waitFor({state:'visible',timeout:30000});
            const body=await cp.locator('body').innerText();
            if(!body.includes('Как к тебе обращаться?'))throw new Error('Name-only join prompt missing');
            if(!body.includes('Без почты, пароля и регистрации.'))throw new Error('Passwordless message missing');
            await name.fill('E2E Production Client');
            await cp.locator('#stableJoinSubmit').click();
            await cp.locator('#roleBadge').filter({hasText:'КЛИЕНТ'}).waitFor({state:'visible',timeout:30000});
            const mainText=await cp.locator('#main').innerText();
            if(!mainText.includes('Привет')&&!mainText.includes('Твой прогресс'))throw new Error(`dashboard missing: ${mainText.slice(0,160)}`);
            const storageKeys=await cp.evaluate(()=>Object.keys(localStorage));
            if(!storageKeys.some(k=>k.includes('auth-token')))throw new Error(`session not persisted: ${storageKeys.join(',')}`);
            pass('client_join','/join -> anonymous auth -> name only -> client dashboard');

            await cp.reload({waitUntil:'networkidle',timeout:60000});
            await cp.locator('#roleBadge').filter({hasText:'КЛИЕНТ'}).waitFor({state:'visible',timeout:30000});
            if(await cp.locator('#stableJoinName').isVisible().catch(()=>false))throw new Error('join form returned after reload');
            pass('client_session_persistence','same-browser session survives reload');

            const resources=await cp.evaluate(()=>performance.getEntriesByType('resource').map(r=>r.name));
            for(const needed of ['/styles.css?v=17.2.0','/app.js?v=17.2.0','/vendor/supabase.min.js?v=17.2.0']){
              if(!resources.some(r=>r.includes(needed)))throw new Error(`missing local resource ${needed}`);
            }
            if(clientErrors.length)throw new Error(clientErrors.join(' | '));
            pass('same_origin_assets','CSS, app JS and Supabase JS loaded locally');
            await client.close();
            report.status='pass';
          }catch(e){
            report.status='fail';fail('browser_e2e',e);process.exitCode=1;
          }finally{
            if(browser)await browser.close().catch(()=>{});
            fs.writeFileSync('production-validation.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
          }
          EOF
          node ./denisfit-e2e.mjs

      - name: Commit validation report
        if: always()
        shell: bash
        run: |
          rm -f denisfit-e2e.mjs
          if [ ! -f production-validation.json ]; then
            printf '{"version":"17.2.0","status":"fail","checked_at":"%s","checks":{"workflow":{"status":"fail","details":"E2E report was not produced"}}}\n' "$(date -u +%FT%TZ)" > production-validation.json
          fi
          git config user.name 'DenisFit Validation'
          git config user.email 'angerkoba90@gmail.com'
          git add production-validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record DenisFit production validation v17.2.0 v2'
            git push
          fi
