name: Validate DenisFit production v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-denisfit-production-v3.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          set -euo pipefail
          node --check app.js
          node --check vendor/supabase.min.js
          test "$(wc -c < app.js)" -gt 150000
          test "$(wc -c < styles.css)" -gt 40000
          grep -q 'signInAnonymously' app.js
          grep -q 'claim-invite' app.js
          grep -q 'create_client_pass' app.js
          grep -q 'Отправить ссылку' app.js
          ! grep -q 'Поделиться Pass' app.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Full E2E
        env:
          JOIN_URL: https://angerkoba90-source.github.io/join/9f435a3f-277a-4cb7-a270-3052bdd4a2f0?v=e2e-1720-v3
        run: |
          cat > denisfit-e2e.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const report={version:'17.2.0',checked_at:new Date().toISOString(),status:'running',checks:{}};
          const pass=(n,d)=>report.checks[n]={status:'pass',details:d};
          const fail=(n,e)=>report.checks[n]={status:'fail',details:String(e?.message||e)};
          let browser;
          try{
            browser=await chromium.launch({headless:true});
            {
              const ctx=await browser.newContext(); const p=await ctx.newPage(); const errs=[];
              p.on('pageerror',e=>errs.push(`pageerror:${e.message}`));
              const r=await p.goto('https://angerkoba90-source.github.io/?prod=1720-v3',{waitUntil:'networkidle',timeout:60000});
              if(!r||r.status()!==200)throw new Error(`root HTTP ${r?.status()}`);
              await p.getByRole('button',{name:'Вход тренера'}).waitFor({state:'visible'});
              await p.getByRole('button',{name:'Вход тренера'}).click();
              await p.locator('#trainerAuthEmail').waitFor({state:'visible'});
              await p.locator('#trainerAuthPassword').waitFor({state:'visible'});
              if(errs.length)throw new Error(errs.join('|'));
              pass('trainer_landing','styled production root and trainer login UI work');
              await ctx.close();
            }
            {
              const ctx=await browser.newContext(); const p=await ctx.newPage(); const errs=[];
              p.on('pageerror',e=>errs.push(`pageerror:${e.message}`));
              const r=await p.goto(process.env.JOIN_URL,{waitUntil:'domcontentloaded',timeout:60000});
              if(!r||![200,404].includes(r.status()))throw new Error(`join HTTP ${r?.status()}`);
              const name=p.locator('#stableJoinName'); await name.waitFor({state:'visible',timeout:30000});
              const labelText=(await p.locator('label[for="stableJoinName"]').textContent().catch(()=>''))?.trim()||'';
              const trainerEmailVisible=await p.locator('#trainerAuthEmail').isVisible().catch(()=>false);
              const trainerPasswordVisible=await p.locator('#trainerAuthPassword').isVisible().catch(()=>false);
              if(trainerEmailVisible||trainerPasswordVisible)throw new Error('email/password visible in client join flow');
              pass('client_join_screen',`name input visible; label="${labelText}"; email/password hidden`);
              await name.fill('E2E Production Client');
              await p.locator('#stableJoinSubmit').click();
              await p.locator('#roleBadge').filter({hasText:'КЛИЕНТ'}).waitFor({state:'visible',timeout:30000});
              const mainText=await p.locator('#main').innerText();
              if(!mainText.includes('Привет')&&!mainText.includes('Твой прогресс'))throw new Error(`dashboard missing: ${mainText.slice(0,180)}`);
              const keys=await p.evaluate(()=>Object.keys(localStorage));
              if(!keys.some(k=>k.includes('auth-token')))throw new Error(`Supabase auth session not stored: ${keys.join(',')}`);
              pass('client_claim','anonymous session + claim-invite + dashboard work');
              await p.reload({waitUntil:'networkidle',timeout:60000});
              await p.locator('#roleBadge').filter({hasText:'КЛИЕНТ'}).waitFor({state:'visible',timeout:30000});
              if(await p.locator('#stableJoinName').isVisible().catch(()=>false))throw new Error('join form returned after reload');
              pass('session_persistence','same-browser anonymous session survives reload');
              const resources=await p.evaluate(()=>performance.getEntriesByType('resource').map(x=>x.name));
              for(const n of ['/styles.css?v=17.2.0','/app.js?v=17.2.0','/vendor/supabase.min.js?v=17.2.0'])if(!resources.some(x=>x.includes(n)))throw new Error(`missing ${n}`);
              if(errs.length)throw new Error(errs.join('|'));
              pass('local_assets','essential frontend assets loaded from GitHub Pages');
              await ctx.close();
            }
            report.status='pass';
          }catch(e){report.status='fail';fail('browser_e2e',e);process.exitCode=1}
          finally{if(browser)await browser.close().catch(()=>{});fs.writeFileSync('production-validation.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2))}
          EOF
          node ./denisfit-e2e.mjs
      - name: Save report
        if: always()
        run: |
          rm -f denisfit-e2e.mjs
          test -f production-validation.json || printf '{"version":"17.2.0","status":"fail","checks":{"workflow":{"status":"fail","details":"report missing"}}}\n' > production-validation.json
          git config user.name 'DenisFit Validation'
          git config user.email 'angerkoba90@gmail.com'
          git add production-validation.json
          if ! git diff --cached --quiet; then git commit -m 'Record DenisFit production validation v17.2.0 v3'; git push; fi
