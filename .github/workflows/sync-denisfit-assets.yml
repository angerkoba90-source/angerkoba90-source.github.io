name: Sync DenisFit production frontend

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-denisfit-assets.yml'

permissions:
  contents: write

concurrency:
  group: denisfit-production-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified v17.1 frontend
        shell: bash
        run: |
          set -euo pipefail
          EDGE='https://dlaiacatpcgbzmumtggw.supabase.co/functions/v1/denisfit-app'
          STORAGE='https://dlaiacatpcgbzmumtggw.supabase.co/storage/v1/object/public/denisfit-web-test'
          curl --retry 4 --retry-delay 2 -fsSL "$EDGE/index.html?deploy=17.1.4" -o index.html
          curl --retry 4 --retry-delay 2 -fsSL "$EDGE/styles.css?deploy=17.1.4" -o styles.css
          curl --retry 4 --retry-delay 2 -fsSL "$EDGE/app.js?deploy=17.1.4" -o app.js
          curl --retry 4 --retry-delay 2 -fsSL "$EDGE/manifest.webmanifest?deploy=17.1.4" -o manifest.webmanifest
          curl --retry 4 --retry-delay 2 -fsSL "$STORAGE/hero-main.jpg?deploy=17.1.4" -o hero-main.jpg
          curl --retry 4 --retry-delay 2 -fsSL "$STORAGE/hero-coach.png?deploy=17.1.4" -o hero-coach.png
          curl --retry 4 --retry-delay 2 -fsSL "$STORAGE/icon-192.png?deploy=17.1.4" -o icon-192.png
          curl --retry 4 --retry-delay 2 -fsSL "$STORAGE/icon-512.png?deploy=17.1.4" -o icon-512.png

      - name: Prepare GitHub Pages build
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('./styles.css?v=17.1', '/styles.css?v=17.1.4')
          s = s.replace('./app.js?v=17.1', '/app.js?v=17.1.4')
          s = s.replace('./hero-main.jpg', '/hero-main.jpg?v=17.1.4')
          s = s.replace('./hero-coach.png', '/hero-coach.png?v=17.1.4')
          s = s.replace('./icon-192.png', '/icon-192.png?v=17.1.4')
          s = s.replace('./manifest.webmanifest', '/manifest.webmanifest?v=17.1.4')
          old = "<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=17.1').catch(()=>{});</script>"
          new = "<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}</script>"
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          Path('404.html').write_text(s, encoding='utf-8')

      - name: Verify build before publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < styles.css)" -gt 40000
          test "$(wc -c < app.js)" -gt 200000
          test "$(wc -c < hero-main.jpg)" -gt 100000
          test "$(wc -c < hero-coach.png)" -gt 100000
          grep -q "signInAnonymously" app.js
          grep -q "stableInviteCodeFromPath" app.js
          grep -q "claim-invite" app.js
          grep -q "PUBLIC_APP_ORIGIN='https://angerkoba90-source.github.io'" app.js
          grep -q '/styles.css?v=17.1.4' index.html
          grep -q '/app.js?v=17.1.4' index.html
          ! grep -q 'denisfit-app/styles.css' index.html
          ! grep -q 'denisfit-app/app.js' index.html

      - name: Publish verified frontend to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DenisFit Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html 404.html styles.css app.js hero-main.jpg hero-coach.png icon-192.png icon-512.png manifest.webmanifest
          if git diff --cached --quiet; then
            echo 'No frontend changes to publish'
            exit 0
          fi
          git commit -m 'Publish DenisFit v17.1.4 verified local frontend'
          git push origin HEAD:main
