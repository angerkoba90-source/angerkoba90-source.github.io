name: Validate DenisFit production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-denisfit-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static production checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check vendor/supabase.min.js
          test "$(wc -c < app.js)" -gt 150000
          test "$(wc -c < styles.css)" -gt 40000
          test "$(wc -c < vendor/supabase.min.js)" -gt 100000
          grep -q 'signInAnonymously' app.js
          grep -q 'claim-invite' app.js
          grep -q 'create_client_pass' app.js
          grep -q 'Отправить ссылку' app.js
          grep -q "PUBLIC_APP_ORIGIN='https://angerkoba90-source.github.io'" app.js
          ! grep -q 'Поделиться Pass' app.js
          grep -q '/styles.css?v=17.2.0' index.html
          grep -q '/app.js?v=17.2.0' index.html
          grep -q '/vendor/supabase.min.js?v=17.2.0' index.html
          ! grep -q 'functions/v1/denisfit-app/styles.css' index.html
          ! grep -q 'functions/v1/denisfit-app/app.js' index.html

      - name: Live asset checks
        shell: bash
        run: |
          set -euo pipefail
          for u in \
            'https://angerkoba90-source.github.io/' \
            'https://angerkoba90-source.github.io/app.js?v=17.2.0' \
            'https://angerkoba90-source.github.io/styles.css?v=17.2.0' \
            'https://angerkoba90-source.github.io/vendor/supabase.min.js?v=17.2.0' \
            'https://angerkoba90-source.github.io/manifest.webmanifest?v=17.2.0' \
            'https://angerkoba90-source.github.io/sw.js?v=17.2.0'; do
            curl --fail --retry 5 --retry-delay 3 --silent --show-error --location "$u" -o /dev/null
          done

      - name: Install Chromium test runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser E2E
        id: e2e
        shell: bash
        env:
          JOIN_URL: https://angerkoba90-source.github.io/join/9f435a3f-277a-4cb7-a270-3052bdd4a2f0?v=e2e-1720
        run: |
          cat > /tmp/denisfit-e2e.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const report = {
            version: '17.2.0',
            checked_at: new Date().toISOString(),
            status: 'running',
            checks: {}
          };
          const pass = (name, details='ok') => report.checks[name] = {status:'pass', details};
          const fail = (name, error) => report.checks[name] = {status:'fail', details:String(error?.message || error)};
          let browser;
          try {
            browser = await chromium.launch({headless:true});

            // Trainer landing page in a clean browser context.
            {
              const ctx = await browser.newContext();
              const page = await ctx.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
              page.on('console', m => { if (m.type()==='error') errors.push(`console: ${m.text()}`); });
              const response = await page.goto('https://angerkoba90-source.github.io/?prod=1720', {waitUntil:'networkidle', timeout:60000});
              if (!response || response.status() !== 200) throw new Error(`root HTTP ${response?.status()}`);
              await page.getByRole('button', {name:'Вход тренера'}).waitFor({state:'visible', timeout:20000});
              const bg = await page.evaluate(() => getComputedStyle(document.body).backgroundColor);
              if (!bg || bg === 'rgba(0, 0, 0, 0)') throw new Error(`CSS not applied: ${bg}`);
              await page.getByRole('button', {name:'Вход тренера'}).click();
              await page.locator('#trainerAuthEmail').waitFor({state:'visible'});
              await page.locator('#trainerAuthPassword').waitFor({state:'visible'});
              if (errors.length) throw new Error(errors.join(' | '));
              pass('trainer_landing', `HTTP 200; CSS applied; trainer email/password panel opens`);
              await ctx.close();
            }

            // Client direct-link flow in a completely clean context.
            {
              const ctx = await browser.newContext();
              const page = await ctx.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
              page.on('console', m => { if (m.type()==='error') errors.push(`console: ${m.text()}`); });
              const response = await page.goto(process.env.JOIN_URL, {waitUntil:'domcontentloaded', timeout:60000});
              // GitHub Pages custom 404 shell may report 404 while correctly running the SPA.
              if (!response || ![200,404].includes(response.status())) throw new Error(`join HTTP ${response?.status()}`);
              const name = page.locator('#stableJoinName');
              await name.waitFor({state:'visible', timeout:30000});
              const visibleText = await page.locator('body').innerText();
              if (!visibleText.includes('Как к тебе обращаться?')) throw new Error('Name-only join prompt missing');
              if (!visibleText.includes('Без почты, пароля и регистрации.')) throw new Error('Passwordless message missing');
              await name.fill('E2E Production Client');
              await page.locator('#stableJoinSubmit').click();
              await page.locator('#roleBadge').filter({hasText:'КЛИЕНТ'}).waitFor({state:'visible', timeout:30000});
              await page.locator('#main').waitFor({state:'visible'});
              const mainText = await page.locator('#main').innerText();
              if (!mainText.includes('Привет') && !mainText.includes('Твой прогресс')) throw new Error(`Client dashboard not rendered: ${mainText.slice(0,200)}`);
              const storageKeys = await page.evaluate(() => Object.keys(localStorage));
              if (!storageKeys.some(k => k.includes('auth-token'))) throw new Error(`Supabase session not persisted: ${storageKeys.join(',')}`);
              pass('client_join', 'Direct /join link -> anonymous auth -> name only -> client dashboard');

              // Same-device session persistence.
              await page.reload({waitUntil:'networkidle', timeout:60000});
              await page.locator('#roleBadge').filter({hasText:'КЛИЕНТ'}).waitFor({state:'visible', timeout:30000});
              if (await page.locator('#stableJoinName').isVisible().catch(()=>false)) throw new Error('Join form returned after reload');
              pass('client_session_persistence', 'Client remains signed in after reload on same browser');

              // Essential production assets are same-origin and successful.
              const resources = await page.evaluate(() => performance.getEntriesByType('resource').map(r => r.name));
              for (const needed of ['/styles.css?v=17.2.0','/app.js?v=17.2.0','/vendor/supabase.min.js?v=17.2.0']) {
                if (!resources.some(r => r.includes(needed))) throw new Error(`Missing local resource ${needed}`);
              }
              if (errors.length) throw new Error(errors.join(' | '));
              pass('same_origin_assets', 'CSS, app JS and Supabase JS loaded from GitHub Pages origin');
              await ctx.close();
            }

            report.status = 'pass';
          } catch (e) {
            report.status = 'fail';
            fail('browser_e2e', e);
            process.exitCode = 1;
          } finally {
            if (browser) await browser.close().catch(()=>{});
            fs.writeFileSync('production-validation.json', JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
          }
          EOF
          node /tmp/denisfit-e2e.mjs

      - name: Commit validation report
        if: always()
        shell: bash
        run: |
          if [ ! -f production-validation.json ]; then
            printf '{"version":"17.2.0","status":"fail","checked_at":"%s","checks":{"workflow":{"status":"fail","details":"E2E report was not produced"}}}\n' "$(date -u +%FT%TZ)" > production-validation.json
          fi
          git config user.name 'DenisFit Validation'
          git config user.email 'angerkoba90@gmail.com'
          git add production-validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record DenisFit production validation v17.2.0'
            git push
          fi
