<html lang="ru">
<head>

<title>Дневник тренировок</title>
<style>
:root{--bg:#080808;--card:#141414;--card2:#1b1b1b;--line:#2b2b2b;--text:#f7f7f7;--muted:#969696;--red:#ff3b30;--green:#32d74b;--r:22px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%;overscroll-behavior:none}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}.app{max-width:430px;margin:auto;min-height:100dvh;padding:18px 16px 104px}.top{display:flex;align-items:flex-start;justify-content:space-between;margin:8px 0 20px}.eyebrow{font-size:12px;color:var(--red);font-weight:800;letter-spacing:.11em}.top h1{font-size:34px;line-height:1;margin:4px 0 0}.kanji{font-size:42px;font-weight:800;color:#272727;line-height:1}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.stat{background:linear-gradient(145deg,#171717,#101010);border:1px solid #202020;border-radius:20px;padding:15px}.stat b{font-size:29px;display:block}.stat span{font-size:12px;color:var(--muted)}.tabs{display:flex;background:#151515;padding:4px;border-radius:15px;margin-bottom:16px}.tabs button{flex:1;border:0;background:transparent;color:#8f8f8f;padding:10px;border-radius:12px;font-weight:700}.tabs button.active{background:#292929;color:#fff}.search{width:100%;height:48px;border:1px solid #242424;background:#121212;border-radius:15px;color:#fff;padding:0 15px;outline:none;margin-bottom:14px}.workout{background:var(--card);border:1px solid #222;border-radius:var(--r);padding:16px;margin-bottom:10px;animation:in .25s ease}.workout-row{display:flex;justify-content:space-between;gap:12px}.date{font-size:12px;color:var(--red);font-weight:800}.workout h3{margin:6px 0 8px;font-size:20px}.meta{color:var(--muted);font-size:13px}.arrow{width:36px;height:36px;border-radius:50%;border:0;background:#232323;color:#fff}.fab{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(398px,calc(100% - 32px));height:54px;border:0;border-radius:18px;background:var(--red);color:#fff;font-weight:800;font-size:16px;box-shadow:0 10px 35px #ff3b3040;z-index:8}.nav{position:fixed;z-index:9;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:calc(70px + env(safe-area-inset-bottom));padding:8px 10px env(safe-area-inset-bottom);background:#0d0d0df2;backdrop-filter:blur(20px);border-top:1px solid #222;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;color:#777;font-size:11px;font-weight:700}.nav button span{display:block;font-size:22px;margin-bottom:3px}.nav button.active{color:var(--red)}.screen{display:none}.screen.active{display:block;animation:in .2s ease}.month-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}.month-head button{width:44px;height:44px;border:0;border-radius:15px;background:#171717;color:#fff;font-size:22px}.month-title{text-align:center}.month-title b{font-size:21px}.month-title span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays div{font-size:11px;text-align:center;color:#666;padding:8px 0}.day{position:relative;aspect-ratio:1/1.08;border:1px solid #202020;background:#121212;border-radius:13px;color:#eee;padding:7px;text-align:left;min-width:0}.day.other{opacity:.28}.day.today{border-color:var(--red)}.day.has{background:#1a1211}.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--red);left:8px;bottom:8px}.cardio{position:absolute;right:6px;bottom:5px;font-size:12px;color:var(--green)}.calendar-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.mini{background:#131313;border-radius:14px;padding:10px;text-align:center}.mini b{display:block;font-size:18px}.mini span{font-size:10px;color:var(--muted)}.panel{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid #222}.panel h3{margin:0 0 14px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.input{width:100%;height:48px;border:1px solid #2a2a2a;background:#101010;color:#fff;border-radius:14px;padding:0 13px;outline:none}.textarea{height:86px;padding-top:12px;resize:none}.label{display:block;color:#888;font-size:12px;margin:12px 0 6px}.exercise{background:#111;border-radius:18px;padding:14px;margin:10px 0;border:1px solid #232323}.exercise-head{display:flex;align-items:center;justify-content:space-between}.exercise h4{margin:0;font-size:17px}.prev{font-size:11px;color:#858585;margin-top:4px}.sets{margin-top:11px}.set{display:grid;grid-template-columns:28px 1fr 18px 1fr 34px;align-items:center;gap:6px;margin:7px 0}.set input{min-width:0;height:40px;border:0;background:#222;color:#fff;border-radius:11px;text-align:center}.set .x{text-align:center;color:#666}.smallbtn{width:34px;height:34px;border:0;border-radius:10px;background:#242424;color:#fff}.add-set,.secondary,.danger{width:100%;height:44px;border-radius:13px;border:0;background:#242424;color:#fff;font-weight:700;margin-top:8px}.danger{color:#ff6961}.primary{width:100%;height:50px;border:0;border-radius:15px;background:var(--red);color:#fff;font-weight:800;margin-top:12px}.sheet-back{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}.sheet{width:min(430px,100%);max-height:88dvh;overflow:auto;background:#161616;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}.grab{width:40px;height:5px;background:#555;border-radius:9px;margin:0 auto 14px}.sheet h2{margin:0 0 14px}.template{width:100%;border:0;background:#222;color:#fff;border-radius:16px;padding:15px;text-align:left;margin:6px 0}.template b{display:block;font-size:16px}.template span{display:block;color:#888;font-size:12px;margin-top:4px}.progress-hero{background:linear-gradient(145deg,#1c1110,#121212);border:1px solid #2b1715;border-radius:26px;padding:18px;position:relative;overflow:hidden}.progress-hero .ghost{position:absolute;right:12px;top:0;font-size:92px;color:#ffffff08;font-weight:900}.progress-hero b{font-size:40px}.progress-hero p{color:#aaa;margin:4px 0}.chart{height:175px;margin-top:14px;display:flex;align-items:flex-end;gap:7px;border-bottom:1px solid #333}.bar{flex:1;min-width:6px;border-radius:8px 8px 2px 2px;background:linear-gradient(#ff5b50,#7d1b16);position:relative}.bar span{position:absolute;top:-20px;width:100%;text-align:center;font-size:9px;color:#aaa}.pr{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #242424}.pr:last-child{border:0}.badge{background:#431412;color:#ff6b61;padding:5px 8px;border-radius:9px;font-size:11px;font-weight:800}.settings-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid #232323}.settings-row:last-child{border:0}.settings-row select{background:#222;color:#fff;border:0;border-radius:10px;padding:8px}.empty{text-align:center;color:#777;padding:40px 10px}.hidden{display:none!important}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(min-width:600px){body{background:#050505}.app{border-left:1px solid #171717;border-right:1px solid #171717}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active">
<div class="top"><div><div class="eyebrow">TRAINING LOG</div><h1>Дневник</h1></div><div class="kanji">継続</div></div>
<div class="summary"><div class="stat"><b id="streak">0</b><span>серия тренировок</span></div><div class="stat"><b id="monthCount">0</b><span>тренировок в месяце</span></div></div>
<div class="tabs"><button id="listTab" class="active">Лента</button><button id="calendarTab">Календарь</button></div>
<div id="listView"><input id="search" class="search" placeholder="Поиск тренировки или упражнения"><div id="workoutList"></div></div>
<div id="calendarInline" class="hidden"></div>
</section>
<section id="calendar" class="screen"><div class="top"><div><div class="eyebrow">ПЛАН И ФАКТ</div><h1>Календарь</h1></div><div class="kanji">力</div></div><div id="calendarMain"></div></section>
<section id="progress" class="screen"><div class="top"><div><div class="eyebrow">СТАТИСТИКА</div><h1>Прогресс</h1></div><div class="kanji">努力</div></div><div id="progressBody"></div></section>
<section id="settings" class="screen"><div class="top"><div><div class="eyebrow">ПАРАМЕТРЫ</div><h1>Настройки</h1></div></div><div class="panel"><div class="settings-row"><span>Единицы</span><select id="units"><option>кг</option><option>lb</option></select></div><div class="settings-row"><span>Таймер отдыха</span><select id="timer"><option value="60">60 сек</option><option value="90">90 сек</option><option value="120">120 сек</option></select></div><button id="exportBtn" class="secondary">Экспорт JSON</button><button id="resetBtn" class="danger">Сбросить демо-данные</button></div></section>
</div>
<button id="fab" class="fab">＋ Новая тренировка</button>
<nav class="nav"><button data-go="home" class="active"><span>⌂</span>Главная</button><button data-go="calendar"><span>▦</span>Календарь</button><button data-go="progress"><span>↗</span>Прогресс</button><button data-go="settings"><span>⚙</span>Настройки</button></nav>
<div id="modal"></div>
<script>
const KEY='workout-journal-v1';
const iso=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const today=iso(new Date());
const demo=()=>({settings:{units:'кг',timer:90},cardio:{},templates:[{id:'t1',name:'Грудь + трицепс',exercises:['Жим лёжа','Жим гантелей под углом','Разгибание рук на блоке']},{id:'t2',name:'Ноги',exercises:['Присед','Румынская тяга','Жим ногами','Сгибание ног']},{id:'t3',name:'Спина + бицепс',exercises:['Подтягивания','Тяга верхнего блока','Тяга горизонтального блока','Сгибание рук']}],workouts:[
{id:'w1',date:iso(new Date(Date.now()-86400000*2)),name:'Грудь + трицепс',note:'Хорошее самочувствие',exercises:[{name:'Жим лёжа',sets:[{w:70,r:10},{w:75,r:8},{w:75,r:8}]},{name:'Жим гантелей под углом',sets:[{w:26,r:10},{w:28,r:9}]}]},
{id:'w2',date:iso(new Date(Date.now()-86400000*5)),name:'Ноги',note:'',exercises:[{name:'Присед',sets:[{w:80,r:10},{w:90,r:8},{w:95,r:6}]},{name:'Румынская тяга',sets:[{w:70,r:10},{w:75,r:10}]}]},
{id:'w3',date:iso(new Date(Date.now()-86400000*9)),name:'Спина + бицепс',note:'',exercises:[{name:'Тяга верхнего блока',sets:[{w:55,r:12},{w:60,r:10},{w:60,r:9}]}]},
{id:'w4',date:iso(new Date(Date.now()-86400000*13)),name:'Грудь + трицепс',note:'',exercises:[{name:'Жим лёжа',sets:[{w:65,r:10},{w:70,r:9},{w:72.5,r:8}]}]}
]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||demo()}catch(e){data=demo()}const save=()=>localStorage.setItem(KEY,JSON.stringify(data));save();
let calDate=new Date();let currentScreen='home';
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
function volume(w){return w.exercises.reduce((a,e)=>a+e.sets.reduce((s,x)=>s+(+x.w||0)*(+x.r||0),0),0)}
function monthly(){const n=new Date();return data.workouts.filter(w=>{const d=new Date(w.date+'T12:00:00');return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear()})}
function streak(){const days=[...new Set(data.workouts.map(w=>w.date))].sort().reverse();if(!days.length)return 0;let s=0,c=new Date();for(let i=0;i<40;i++){const k=iso(c);if(days.includes(k)||i===0&&days.includes(iso(new Date(c-86400000)))){if(days.includes(k))s++;c=new Date(c-86400000)}else if(i===0){c=new Date(c-86400000)}else break}return s}
function renderHome(){q('#streak').textContent=streak();q('#monthCount').textContent=monthly().length;renderList(q('#search').value||'')}
function renderList(filter=''){const f=filter.toLowerCase();const arr=[...data.workouts].sort((a,b)=>b.date.localeCompare(a.date)).filter(w=>!f||w.name.toLowerCase().includes(f)||w.exercises.some(e=>e.name.toLowerCase().includes(f)));q('#workoutList').innerHTML=arr.length?arr.map(w=>`<article class="workout" data-open="${w.id}"><div class="workout-row"><div><div class="date">${new Date(w.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div><h3>${w.name}</h3><div class="meta">${w.exercises.length} упр. · ${Math.round(volume(w)).toLocaleString('ru-RU')} кг</div></div><button class="arrow">›</button></div></article>`).join(''):'<div class="empty">Тренировок пока нет</div>';qa('[data-open]').forEach(x=>x.onclick=()=>openWorkout(x.dataset.open))}
function calendarHTML(){const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7;let cells='';for(let i=0;i<42;i++){const d=new Date(y,m,1-start+i),k=iso(d),other=d.getMonth()!=m,has=data.workouts.some(w=>w.date==k),card=data.cardio[k];cells+=`<button class="day ${other?'other':''} ${k==today?'today':''} ${has?'has':''}" data-day="${k}">${d.getDate()}${has?'<i class="dot"></i>':''}${card?'<i class="cardio">✓</i>':''}</button>`}const ms=data.workouts.filter(w=>{const d=new Date(w.date+'T12:00:00');return d.getMonth()==m&&d.getFullYear()==y});const ton=Math.round(ms.reduce((a,w)=>a+volume(w),0));return `<div class="month-head"><button data-prev>‹</button><div class="month-title"><b>${calDate.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><span>фаза: базовая · 8–12 повторений</span></div><button data-next>›</button></div><div class="calendar-stats"><div class="mini"><b>${ms.length}</b><span>тренировок</span></div><div class="mini"><b>${(ton/1000).toFixed(1)}т</b><span>тоннаж</span></div><div class="mini"><b>${(ms.length/4.33).toFixed(1)}</b><span>в неделю</span></div></div><div class="weekdays">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div><div class="grid">${cells}</div>`}
function bindCalendar(root){root.querySelector('[data-prev]').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendars()};root.querySelector('[data-next]').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendars()};root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>daySheet(b.dataset.day))}
function renderCalendars(){const main=q('#calendarMain'),inline=q('#calendarInline');main.innerHTML=calendarHTML();inline.innerHTML=calendarHTML();bindCalendar(main);bindCalendar(inline)}
function daySheet(date){const found=data.workouts.find(w=>w.date==date);if(found)return openWorkout(found.id);const opts=data.templates.map(t=>`<button class="template" data-template="${t.id}"><b>${t.name}</b><span>${t.exercises.join(' · ')}</span></button>`).join('');showSheet(`<h2>${new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</h2><button class="template" id="toggleCardio"><b>${data.cardio[date]?'✓ Кардио выполнено':'30 минут кардио'}</b><span>Отметить цель дня</span></button>${opts}<button class="template" data-template="blank"><b>Без шаблона</b><span>Пустая тренировка</span></button>`);q('#toggleCardio').onclick=()=>{data.cardio[date]=!data.cardio[date];save();closeSheet();renderCalendars()};qa('[data-template]').forEach(x=>x.onclick=()=>{const t=data.templates.find(t=>t.id==x.dataset.template);closeSheet();editWorkout({id:'w'+Date.now(),date,name:t?t.name:'Новая тренировка',note:'',exercises:t?t.exercises.map(n=>({name:n,sets:[{w:'',r:''}]})):[]},true)})}
function showSheet(html){q('#modal').innerHTML=`<div class="sheet-back" id="back"><div class="sheet"><div class="grab"></div>${html}</div></div>`;q('#back').onclick=e=>{if(e.target.id==='back')closeSheet()}}
function closeSheet(){q('#modal').innerHTML=''}
function openWorkout(id){const w=data.workouts.find(x=>x.id==id);if(w)editWorkout(JSON.parse(JSON.stringify(w)),false)}
function editWorkout(w,isNew){let exerciseHTML=w.exercises.map((e,i)=>exerciseBlock(e,i)).join('');showSheet(`<h2>${isNew?'Новая тренировка':'Тренировка'}</h2><label class="label">Дата</label><input id="wDate" class="input" type="date" value="${w.date}"><label class="label">Название</label><input id="wName" class="input" value="${esc(w.name)}"><div id="exerciseWrap">${exerciseHTML}</div><button id="addExercise" class="secondary">＋ Добавить упражнение</button><label class="label">Заметка</label><textarea id="wNote" class="input textarea" placeholder="Самочувствие, техника, комментарий">${esc(w.note||'')}</textarea><button id="saveWorkout" class="primary">Сохранить тренировку</button>${isNew?'':`<button id="deleteWorkout" class="danger">Удалить тренировку</button>`}`);bindExerciseEditor();q('#addExercise').onclick=()=>{q('#exerciseWrap').insertAdjacentHTML('beforeend',exerciseBlock({name:'',sets:[{w:'',r:''}]},q('#exerciseWrap').children.length));bindExerciseEditor()};q('#saveWorkout').onclick=()=>{const nw={id:w.id,date:q('#wDate').value,name:q('#wName').value.trim()||'Тренировка',note:q('#wNote').value,exercises:readExercises()};const idx=data.workouts.findIndex(x=>x.id==w.id);if(idx>=0)data.workouts[idx]=nw;else data.workouts.push(nw);save();closeSheet();refresh()};if(!isNew)q('#deleteWorkout').onclick=()=>{data.workouts=data.workouts.filter(x=>x.id!=w.id);save();closeSheet();refresh()}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function exerciseBlock(e,i){return `<div class="exercise"><div class="exercise-head"><div style="flex:1"><input class="input ex-name" placeholder="Название упражнения" value="${esc(e.name)}"><div class="prev">в прошлый раз: ${lastResult(e.name)}</div></div><button class="smallbtn rm-ex">×</button></div><div class="sets">${e.sets.map((s,j)=>setRow(s,j)).join('')}</div><button class="add-set">＋ Подход</button></div>`}
function setRow(s,j){return `<div class="set"><span>${j+1}</span><input class="set-w" type="number" inputmode="decimal" placeholder="кг" value="${s.w}"><span class="x">×</span><input class="set-r" type="number" inputmode="numeric" placeholder="повт" value="${s.r}"><button class="smallbtn rm-set">×</button></div>`}
function lastResult(name){if(!name)return '—';const a=[...data.workouts].sort((a,b)=>b.date.localeCompare(a.date));for(const w of a){const e=w.exercises.find(e=>e.name==name);if(e&&e.sets.length)return e.sets.map(s=>`${s.w}×${s.r}`).join(', ')}return '—'}
function bindExerciseEditor(){qa('.exercise').forEach(ex=>{ex.querySelector('.add-set').onclick=()=>{const sets=ex.querySelector('.sets');sets.insertAdjacentHTML('beforeend',setRow({w:'',r:''},sets.children.length));bindExerciseEditor()};ex.querySelector('.rm-ex').onclick=()=>ex.remove();ex.querySelectorAll('.rm-set').forEach(b=>b.onclick=()=>{b.closest('.set').remove();[...ex.querySelectorAll('.set>span:first-child')].forEach((s,i)=>s.textContent=i+1)})})}
function readExercises(){return [...q('#exerciseWrap').children].map(ex=>({name:ex.querySelector('.ex-name').value.trim()||'Упражнение',sets:[...ex.querySelectorAll('.set')].map(s=>({w:+s.querySelector('.set-w').value||0,r:+s.querySelector('.set-r').value||0}))}))}
function renderProgress(){const all={};data.workouts.forEach(w=>w.exercises.forEach(e=>{(all[e.name]??=[]).push({date:w.date,max:Math.max(0,...e.sets.map(s=>+s.w||0)),vol:e.sets.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0)})}));const names=Object.keys(all);if(!names.length){q('#progressBody').innerHTML='<div class="empty">Добавь тренировки, чтобы увидеть прогресс</div>';return}const name=names.includes('Жим лёжа')?'Жим лёжа':names[0],pts=all[name].sort((a,b)=>a.date.localeCompare(b.date)),max=Math.max(...pts.map(p=>p.max),1),best=Math.max(...pts.map(p=>p.max));q('#progressBody').innerHTML=`<div class="progress-hero"><div class="ghost">力</div><div class="eyebrow">${name.toUpperCase()}</div><b>${best} ${data.settings.units}</b><p>лучший рабочий вес</p><div class="chart">${pts.map(p=>`<div class="bar" style="height:${Math.max(8,p.max/max*100)}%"><span>${p.max}</span></div>`).join('')}</div></div><div class="panel" style="margin-top:12px"><h3>Личные рекорды</h3>${[...pts].sort((a,b)=>b.max-a.max).slice(0,5).map((p,i)=>`<div class="pr"><div><b>${p.max} ${data.settings.units}</b><div class="meta">${new Date(p.date+'T12:00:00').toLocaleDateString('ru-RU')}</div></div>${i==0?'<span class="badge">PR</span>':''}</div>`).join('')}</div>`}
function refresh(){renderHome();renderCalendars();renderProgress();q('#units').value=data.settings.units;q('#timer').value=data.settings.timer}
q('#search').oninput=e=>renderList(e.target.value);q('#listTab').onclick=()=>{q('#listTab').classList.add('active');q('#calendarTab').classList.remove('active');q('#listView').classList.remove('hidden');q('#calendarInline').classList.add('hidden')};q('#calendarTab').onclick=()=>{q('#calendarTab').classList.add('active');q('#listTab').classList.remove('active');q('#listView').classList.add('hidden');q('#calendarInline').classList.remove('hidden');renderCalendars()};q('#fab').onclick=()=>editWorkout({id:'w'+Date.now(),date:today,name:'Новая тренировка',note:'',exercises:[]},true);qa('.nav button').forEach(b=>b.onclick=()=>{currentScreen=b.dataset.go;qa('.screen').forEach(s=>s.classList.toggle('active',s.id==currentScreen));qa('.nav button').forEach(x=>x.classList.toggle('active',x==b));q('#fab').classList.toggle('hidden',currentScreen==='settings'||currentScreen==='progress');if(currentScreen==='calendar')renderCalendars();if(currentScreen==='progress')renderProgress()});q('#units').onchange=e=>{data.settings.units=e.target.value;save();refresh()};q('#timer').onchange=e=>{data.settings.timer=+e.target.value;save()};q('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workout-journal-backup.json';a.click();URL.revokeObjectURL(a.href)};q('#resetBtn').onclick=()=>{if(confirm('Сбросить данные и вернуть демо?')){data=demo();save();refresh()}};refresh();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
