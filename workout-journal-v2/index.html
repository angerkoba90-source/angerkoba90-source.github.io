<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090a0c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Дневник тренировок</title><style>
:root{--bg:#090a0c;--card:#17191d;--card2:#23262c;--line:#30343b;--text:#f5f5f7;--muted:#8d9199;--accent:#ff4b16;--green:#32d74b;--r:20px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:linear-gradient(#111419 0,#090a0c 35%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,textarea{font:inherit}.app{max-width:430px;margin:auto;min-height:100dvh;padding:16px 10px 104px}.screen{display:none}.screen.active{display:block}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:2px 6px 12px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:800}.top h1{font-size:32px;line-height:1;margin:5px 0}.sub{font-size:12px;color:var(--muted)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#0c0e11ef;backdrop-filter:blur(22px);border-top:1px solid #23262c;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:#72767d;font-size:10px;font-weight:700;min-height:50px}.nav button span{display:block;font-size:21px;margin-bottom:2px}.nav button.active{color:var(--accent)}.week-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:0 6px 10px}.week-head button{width:44px;height:44px;border:0;border-radius:14px;background:#22252b;color:#fff;font-size:22px}.week-title{text-align:center}.week-title b{display:block;font-size:16px}.week-title span{font-size:11px;color:var(--muted)}.calendar-wrap{border:1px solid #292d33;border-radius:18px;overflow:hidden;background:#111317}.cal-head,.cal-row{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr))}.cal-head{position:sticky;top:0;z-index:4;background:#15181c;border-bottom:1px solid #292d33}.cal-head div{min-height:5 ms:center;gap:12px}.exercise-icon{width:46px;height:46px;border-radius:14px;background:#292d33;display:grid;place-items:center;font-size:20px}.exercise-main{min-width:0;flex:1}.exercise-main h3{margin:0 0 5px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exercise-main span{font-size:11px;color:var(--muted)}.exercise-side{text-align:right}.exercise-side b{display:block;font-size:16px}.delta{font-size:10px;color:var(--green);margin-top:3px}.delta.down{color:#ff7770}.history-card{padding:14px;margin:10px 6px}.history-card .date{color:var(--accent);font-size:11px;font-weight:800}.history-card h3{margin:5px 0}.history-card p{margin:0;color:var(--muted);font-size:12px}.modal-back{position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(430px,100%);max-height:91dvh;overflow:auto;background:#17191d;border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom))}.grab{width:42px;height:5px;background:#555a61;border-radius:9px;margin:0 auto 14px}.sheet h2{margin:0 0 6px}.sheet .when{color:var(--accent);font-size:12px;font-weight:800;margin-bottom:16px}.template-pick{width:100%;border:1px solid #343941;background:#22252b;color:#fff;border-radius:16px;padding:14px;text-align:left;margin:7px 0}.template-pick b{display:block}.template-pick span{display:block;color:#8e9299;font-size:11px;margin-top:4px}.label{font-size:12px;color:#8d9199;display:block;margin:11px 0 6px}.input{width:100%;height:48px;border:1px solid #353941;background:#111317;color:#fff;border-radius:14px;padding:0 13px}.textarea{height:90px;padding-top:12px;resize:none}.exercise-line{display:grid;grid-template-columns:1fr 42px;gap:8px;margin:8px 0}.exercise-line button{border:0;border-radius:12px;background:#292d33;color:#ff8270}.set-row{display:grid;grid-template-columns:1fr 16px 1fr 40px;gap:7px;align-items:center;margin:7px 0}.set-row input{height:42px;border:1px solid #343941;background:#111317;color:#fff;border-radius:12px;text-align:center}.set-row button{height:42px;border:0;border-radius:12px;background:#292d33;color:#ff8270}.back{width:46px;height:46px;border:0;border-radius:14px;background:#25282e;color:#ddd;font-size:24px;margin:4px 6px 54px}.detail{padding:0 6px}.detail-title{font-size:30px;font-weight:400;line-height:1.08;margin:0 0 28px}.detail-hero{background:#383c43;border-radius:22px;padding:20px;display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center}.detail-hero strong{font-size:34px;font-weight:500}.detail-hero span{font-size:13px;color:#a6a9b0;line-height:1.35}.detail-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 44px}.metric-big{background:#383c43;border-radius:22px;padding:18px;min-height:126px}.metric-big b{display:block;font-size:28px;font-weight:400;padding-bottom:13px;border-bottom:1px solid #4a4e55}.metric-big span{display:block;color:#a0a4ab;font-size:12px;line-height:1.35;margin-top:12px}.section-title{font-size:24px;margin:0 0 20px}.period-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.period-tabs button{height:44px;border:0;border-radius:14px;background:#3a3e45;color:#b5b8bd;font-size:12px}.period-tabs button.active{background:var(--accent);color:#fff}.metric-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.metric-tabs button{border:1px solid #343941;background:#17191d;color:#93979e;border-radius:999px;padding:8px 11px;font-size:11px}.metric-tabs button.active{background:#292d33;color:#fff}.chart-label{font-size:12px;color:#858991;margin-bottom:8px}.big-chart{height:320px;position:relative;margin-bottom:8px}.big-chart svg{width:100%;height:100%;overflow:visible}.chart-empty{height:250px;display:grid;place-items:center;color:#73777e;border-bottom:1px solid #2a2d33}.hidden{display:none!important}@media(min-width:600px){.app{border-left:1px solid #1c1f24;border-right:1px solid #1c1f24}}
</style></head><body><div class="app">
<section id="calendar" class="screen active"><div class="top"><div><div class="eyebrow">WEEK SCHEDULE</div><h1>Неделя</h1><div class="sub">Тапни на день и время</div></div></div><div class="week-head"><button id="prevWeek">‹</button><div class="week-title"><b id="weekLabel"></b><span id="weekRange"></span></div><button id="nextWeek">›</button></div><div class="calendar-wrap"><div id="calHead" class="cal-head"></div><div id="calBody"></div></div><div class="legend"><span><i style="background:#8a4b36"></i>запланировано</span><span><i style="background:#32d74b"></i>выполнено</span></div></section>
<section id="templates" class="screen"><div class="top"><div><div class="eyebrow">WORKOUT TEMPLATES</div><h1>Шаблоны</h1><div class="sub">Готовые тренировки в один тап</div></div></div><div class="panel"><button id="newTemplate" class="btn">+ Новый шаблон</button></div><div id="templateList"></div></section>
<section id="progress" class="screen"><div class="top"><div><div class="eyebrow">EXERCISE PROGRESS</div><h1>Прогресс</h1><div class="sub">Каждое упражнение — отдельная история</div></div></div><div id="exerciseList"></div></section>
<section id="history" class="screen"><div class="top"><div><div class="eyebrow">WORKOUT HISTORY</div><h1>История</h1></div></div><div id="historyList"></div></section>

</div><nav class="nav"><button data-go="calendar" class="active"><span>▦</span>Календарь</button><button data-go="templates"><span>型</span>Шаблоны</button><button data-go="progress"><span>↗</span>Прогресс</button><button data-go="history"><span>◷</span>История</button></nav><div id="modal"></div>
<script>
const KEY='workout-journal-v1',TPLKEY='workout-journal-templates-v2',SCHEDKEY='workout-journal-schedule-v3';const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];const iso=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}};let data=load(KEY,{workouts:[]});if(!data.workouts)data.workouts=[];let templates=load(TPLKEY,null)||data.templates||[{id:'t1',name:'Грудь + трицепс',exercises:['Жим лёжа','Жим гантелей под углом','Разгибание рук на блоке']},{id:'t2',name:'Ноги',exercises:['Присед','Румынская тяга','Жим ногами','Сгибание ног']}];let schedule=load(SCHEDKEY,[]);const saveData=()=>localStorage.setItem(KEY,JSON.stringify(data)),saveTpl=()=>localStorage.setItem(TPLKEY,JSON.stringify(templates)),saveSchedule=()=>localStorage.setItem(SCHEDKEY,JSON.stringify(schedule));saveTpl();saveSchedule();let weekOffset=0,detailName=null,detailPeriod='3m',detailMetric='weight';const HOURS=Array.from({length:16},(_,i)=>i+7);const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function weekStart(){const n=new Date(),day=(n.getDay()+6)%7;const d=new Date(n);d.setHours(0,0,0,0);d.setDate(n.getDate()-day+weekOffset*7);return d}function weekDates(){const s=weekStart();return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return d})}function fmtDate(d){return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}function eventAt(date,h){return schedule.find(e=>e.date===iso(date)&&+e.hour===h)}
function renderCalendar(){const dates=weekDates(),today=iso(new Date());q('#weekLabel').textContent=weekOffset===0?'Эта неделя':weekOffset===1?'Следующая неделя':weekOffset===-1?'Прошлая неделя':`Неделя ${weekOffset>0?'＋':''}${weekOffset}`;q('#weekRange').textContent=`${fmtDate(dates[0])} — ${fmtDate(dates[6])}`;q('#calHead').innerHTML='<div></div>'+dates.map((d,i)=>`<div class="${iso(d)===today?'today':''}"><span>${DAYS[i]}</span><b>${d.getDate()}</b></div>`).join('');q('#calBody').innerHTML=HOURS.map(h=>`<div class="cal-row"><div class="cal-time">${String(h).padStart(2,'0')}</div>${dates.map(d=>{const e=eventAt(d,h);return`<div class="slot" data-date="${iso(d)}" data-hour="${h}">${e?`<div class="event ${e.done?'done':''}" data-event="${e.id}">${e.name}</div>`:''}</div>`}).join('')}</div>`).join('');qa('.slot').forEach(el=>el.addEventListener('click',ev=>{const eventEl=ev.target.closest('.event');if(eventEl){openScheduled(eventEl.dataset.event);return}openSlot(el.dataset.date,+el.dataset.hour)}))}
function openSlot(date,hour){const d=new Date(date+'T12:00:00');q('#modal').innerHTML=`<div class="modal-back"><div class="sheet"><div class="grab"></div><h2>Добавить тренировку</h2><div class="when">${d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})} · ${String(hour).padStart(2,'0')}:00</div><div id="slotTemplates"></div><button id="blankWorkout" class="btn secondary">+ Создать тренировку</button><button id="closeSheet" class="btn ghost">Отмена</button></div></div>`;q('#slotTemplates').innerHTML=templates.map(t=>`<button class="template-pick" data-tpl="${t.id}"><b>${t.name}</b><span>${t.exercises.join(' · ')||'Без упражнений'}</span></button>`).join('')||'<div class="sub">Шаблонов пока нет.</div>';qa('[data-tpl]').forEach(b=>b.addEventListener('click',()=>{const t=templates.find(x=>x.id===b.dataset.tpl);schedule.push({id:'e'+Date.now(),date,hour,name:t.name,exercises:[...t.exercises],done:false});saveSchedule();closeModal();renderCalendar()}));q('#blankWorkout').onclick=()=>openWorkoutForm({date,hour});q('#closeSheet').onclick=closeModal}
function openScheduled(id){const e=schedule.find(x=>x.id===id);if(!e)return;q('#modal').innerHTML=`<div class="modal-back"><div class="sheet"><div class="grab"></div><h2>${e.name}</h2><div class="when">${new Date(e.date+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})} · ${String(e.hour).padStart(2,'0')}:00</div><div class="chips">${(e.exercises||[]).map(x=>`<span class="chip">${x}</span>`).join('')}</div>${e.done?'<div class="panel"><b>Тренировка выполнена</b></div>':'<button id="startWorkout" class="btn">Начать тренировку</button>'}<button id="deleteEvent" class="btn danger">Удалить из календаря</button><button id="closeSheet" class="btn secondary">Закрыть</button></div></div>`;if(q('#startWorkout'))q('#startWorkout').onclick=()=>openWorkoutEditor(e);q('#deleteEvent').onclick=()=>{schedule=schedule.filter(x=>x.id!==id);saveSchedule();closeModal();renderCalendar()};q('#closeSheet').onclick=closeModal}
function openWorkoutForm(ctx){q('#modal').innerHTML=`<div class="modal-back"><div class="sheet"><div class="grab"></div><h2>Новая тренировка</h2><div class="when">${ctx.date} · ${String(ctx.hour).padStart(2,'0')}:00</div><label class="label">Название</label><input id="newWorkoutName" class="input" placeholder="Например: Спина + бицепс"><label class="label">Упражнения — каждое с новой строки</label><textarea id="newWorkoutExercises" class="input textarea" placeholder="Тяга верхнего блока\nТяга гантели\nСгибание рук"></textarea><button id="saveBlank" class="btn">Добавить в календарь</button><button id="cancelBlank" class="btn secondary">Отмена</button></div></div>`;q('#saveBlank').onclick=()=>{const name=q('#newWorkoutName').value.trim();if(!name)return;const exercises=q('#newWorkoutExercises').value.split('\n').map(x=>x.trim()).filter(Boolean);schedule.push({id:'e'+Date.now(),date:ctx.date,hour:ctx.hour,name,exercises,done:false});saveSchedule();closeModal();renderCalendar()};q('#cancelBlank').onclick=closeModal}
function openWorkoutEditor(event){q('#modal').innerHTML=`<div class="modal-back"><div class="sheet"><div class="grab"></div><h2>${event.name}</h2><div class="when">Запись результата</div><div id="editorExercises"></div><button id="saveWorkout" class="btn">Сохранить тренировку</button><button id="cancelWorkout" class="btn secondary">Отмена</button></div></div>`;q('#editorExercises').innerHTML=(event.exercises||[]).map((name,i)=>`<div class="panel exedit" data-name="${name.replace(/"/g,'&quot;')}"><h3>${name}</h3><div class="sets"><div class="set-row"><input inputmode="decimal" placeholder="кг"><span>×</span><input inputmode="numeric" placeholder="повт"><button class="rmset">×</button></div></div><button class="btn secondary addset" type="button">+ Подход</button></div>`).join('');qa('.addset').forEach(b=>b.onclick=()=>{b.previousElementSibling.insertAdjacentHTML('beforeend','<div class="set-row"><input inputmode="decimal" placeholder="кг"><span>×</span><input inputmode="numeric" placeholder="повт"><button class="rmset">×</button></div>');bindRm()});bindRm();q('#saveWorkout').onclick=()=>{const exercises=qa('.exedit').map(el=>({name:el.dataset.name,sets:[...el.querySelectorAll('.set-row')].map(r=>{const ins=r.querySelectorAll('input');return{w:+ins[0].value||0,r:+ins[1].value||0}}).filter(s=>s.w||s.r)}));data.workouts.push({id:'w'+Date.now(),date:event.date,name:event.name,note:'',exercises});event.done=true;saveData();saveSchedule();closeModal();renderCalendar();renderHistory()};q('#cancelWorkout').onclick=closeModal}function bindRm(){qa('.rmset').forEach(b=>b.onclick=()=>b.closest('.set-row').remove())}function closeModal(){q('#modal').innerHTML=''}
function renderTemplates(){q('#templateList').innerHTML=templates.map(t=>`<div class="template-card"><h3>${t.name}</h3><div class="chips">${t.exercises.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="row-actions"><button class="editTpl" data-id="${t.id}">Изменить</button><button class="useTpl primary" data-id="${t.id}">В календарь</button></div></div>`).join('')||'<div class="panel">Шаблонов пока нет.</div>';qa('.editTpl').forEach(b=>b.onclick=()=>openTemplateEditor(b.dataset.id));qa('.useTpl').forEach(b=>b.onclick=()=>{go('calendar');setTimeout(()=>openSlot(iso(new Date()),12),30)})}
function openTemplateEditor(id){const old=templates.find(x=>x.id===id);q('#modal').innerHTML=`<div class="modal-back"><div class="sheet"><div class="grab"></div><h2>${old?'Редактировать':'Новый шаблон'}</h2><label class="label">Название</label><input id="tplName" class="input" value="${old?old.name.replace(/"/g,'&quot;'):''}"><label class="label">Упражнения — каждое с новой строки</label><textarea id="tplExercises" class="input textarea">${old?old.exercises.join('\n'):''}</textarea><button id="saveTpl" class="btn">Сохранить</button>${old?'<button id="deleteTpl" class="btn danger">Удалить шаблон</button>':''}<button id="cancelTpl" class="btn secondary">Отмена</button></div></div>`;q('#saveTpl').onclick=()=>{const name=q('#tplName').value.trim();if(!name)return;const exercises=q('#tplExercises').value.split('\n').map(x=>x.trim()).filter(Boolean);if(old){old.name=name;old.exercises=exercises}else templates.push({id:'t'+Date.now(),name,exercises});saveTpl();closeModal();renderTemplates()};if(q('#deleteTpl'))q('#deleteTpl').onclick=()=>{templates=templates.filter(x=>x.id!==id);saveTpl();closeModal();renderTemplates()};q('#cancelTpl').onclick=closeModal}
function histories(){const map={};data.workouts.forEach(w=>(w.exercises||[]).forEach(e=>{(map[e.name]??=[]).push({date:w.date,sets:e.sets||[]})}));Object.values(map).forEach(a=>a.sort((x,y)=>x.date.localeCompare(y.date)));return map}function bestSet(h){let b={w:0,r:0,date:''};h.forEach(x=>x.sets.forEach(s=>{if((+s.w||0)>b.w||((+s.w||0)===b.w&&(+s.r||0)>b.r))b={w:+s.w||0,r:+s.r||0,date:x.date}}));return b}function histVol(x){return x.sets.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0)}function maxW(x){return Math.max(0,...x.sets.map(s=>+s.w||0))}function renderProgress(){const map=histories();q('#exerciseList').innerHTML=Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0],'ru')).map(([name,h])=>{const first=maxW(h[0]),last=maxW(h.at(-1)),pct=first?Math.round((last-first)/first*100):0,bs=bestSet(h);return`<div class="exercise-tile" data-ex="${encodeURIComponent(name)}"><div class="exercise-icon">↗</div><div class="exercise-main"><h3>${name}</h3><span>${h.length} тренировок · лучший ${bs.w}×${bs.r}</span></div><div class="exercise-side"><b>${last} кг</b><div class="delta ${pct<0?'down':''}">${pct>0?'+':''}${pct}%</div></div></div>`}).join('')||'<div class="panel">Добавь тренировку, чтобы увидеть прогресс.</div>';qa('.exercise-tile').forEach(x=>x.onclick=()=>openExercise(decodeURIComponent(x.dataset.ex)))}function openExercise(name){detailName=name;detailPeriod='3m';detailMetric='weight';go('exerciseDetail');renderDetail()}
function filteredHist(h){if(detailPeriod==='all')return h;const days={m:31,'3m':93,y:366}[detailPeriod]||93,cut=Date.now()-days*86400000;return h.filter(x=>new Date(x.date+'T12:00:00').getTime()>=cut)}function points(h){return h.map(x=>({date:x.date,val:detailMetric==='volume'?histVol(x):detailMetric==='best'?Math.max(0,...x.sets.map(s=>(+s.w||0)*(+s.r||0))):maxW(x)}))}function svgLine(p){if(!p.length)return'<div class="chart-empty">Нет данных за период</div>';const W=360,H=260,pad=28,max=Math.max(1,...p.map(x=>x.val)),min=Math.min(...p.map(x=>x.val));const span=Math.max(1,max-min),xs=p.map((_,i)=>pad+i*((W-pad*2)/Math.max(1,p.length-1))),ys=p.map(x=>H-pad-((x.val-min)/span)*(H-pad*2));const path=xs.map((x,i)=>`${i?'L':'M'}${x},${ys[i]}`).join(' ');return`<svg viewBox="0 0 ${W} ${H}" aria-label="График прогресса"><line x1="${pad}" x2="${W-pad}" y1="${H-pad}" y2="${H-pad}" stroke="#2d3137"/><path d="${path}" fill="none" stroke="#ff4b16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${p.map((x,i)=>`<circle cx="${xs[i]}" cy="${ys[i]}" r="5" fill="#d9dce0" stroke="#555a61" stroke-width="2"/><text x="${xs[i]}" y="${H-5}" fill="#73777e" font-size="9" text-anchor="middle">${x.date.slice(5).split('-').reverse().join('.')}</text>`).join('')}</svg>`}
function renderDetail(){const h=(histories()[detailName]||[]),fh=filteredHist(h),bs=bestSet(h),first=maxW(h[0]||{sets:[]}),last=maxW(h.at(-1)||{sets:[]}),pct=first?Math.round((last-first)/first*100):0;q('#detailBody').innerHTML=`<h1 class="detail-title">${detailName}</h1><div class="detail-hero"><strong>${pct>0?'+':''}${pct}%</strong><span>Изменение максимального рабочего веса от первой записи к последней.</span></div><div class="detail-metrics"><div class="metric-big"><b>${Math.max(0,...h.map(maxW))} кг</b><span>Максимальный рабочий вес</span></div><div class="metric-big"><b>${bs.w}×${bs.r}</b><span>Лучший результат<br>${bs.date?new Date(bs.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}):'—'}</span></div></div><h2 class="section-title">ПРОГРЕСС ПО УПРАЖНЕНИЮ</h2><div class="period-tabs"><button data-period="m">Месяц</button><button data-period="3m">3 месяца</button><button data-period="y">Год</button><button data-period="all">Все</button></div><div class="metric-tabs"><button data-detailmetric="weight">Вес</button><button data-detailmetric="volume">Объём</button><button data-detailmetric="best">Лучший подход</button></div><div class="chart-label">${detailMetric==='weight'?'Максимальный рабочий вес, кг':detailMetric==='volume'?'Объём, кг × повторы':'Лучший подход, кг × повторы'}</div><div class="big-chart">${svgLine(points(fh))}</div>`;qa('[data-period]').forEach(b=>{b.classList.toggle('active',b.dataset.period===detailPeriod);b.onclick=()=>{detailPeriod=b.dataset.period;renderDetail()}});qa('[data-detailmetric]').forEach(b=>{b.classList.toggle('active',b.dataset.detailmetric===detailMetric);b.onclick=()=>{detailMetric=b.dataset.detailmetric;renderDetail()}})}
function renderHistory(){q('#historyList').innerHTML=[...data.workouts].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="history-card"><div class="date">${new Date(w.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</div><h3>${w.name}</h3><p>${(w.exercises||[]).map(e=>e.name).join(' · ')}</p></div>`).join('')||'<div class="panel">История пока пустая.</div>'}
function go(id){qa('.screen').forEach(s=>s.classList.toggle('active',s.id===id));qa('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===id));q('.nav').classList.toggle('hidden',id==='exerciseDetail');if(id==='calendar')renderCalendar();if(id==='templates')renderTemplates();if(id==='progress')renderProgress();if(id==='history')renderHistory()}qa('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));q('#prevWeek').onclick=()=>{weekOffset--;renderCalendar()};q('#nextWeek').onclick=()=>{weekOffset++;renderCalendar()};q('#newTemplate').onclick=()=>openTemplateEditor();q('#backProgress').onclick=()=>go('progress');renderCalendar();
</script></body></html>
