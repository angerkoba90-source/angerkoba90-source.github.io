<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080808"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Дневник тренировок v2</title><style>
:root{--bg:#080808;--card:#151515;--line:#292929;--text:#f7f7f7;--muted:#929292;--red:#ff3b30;--green:#32d74b;--yellow:#ffd60a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}.app{max-width:430px;margin:auto;padding:18px 16px 110px;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:flex-start;margin:8px 0 18px}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:800;color:var(--red)}h1{font-size:34px;line-height:1;margin:4px 0}.kanji{font-size:42px;color:#252525;font-weight:900}.summary{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}.stat,.panel,.exercise-card,.plan-card,.template-card{background:linear-gradient(145deg,#171717,#111);border:1px solid #232323;border-radius:22px}.stat{padding:15px}.stat b{display:block;font-size:29px}.stat span{font-size:12px;color:var(--muted)}.panel,.plan-card,.template-card{padding:16px;margin:12px 0}.panel h3,.plan-card h3,.template-card h3{margin:0 0 12px}.tabs{display:flex;background:#151515;padding:4px;border-radius:15px;margin:12px 0}.tabs button{flex:1;border:0;background:none;color:#777;padding:10px;border-radius:12px;font-weight:700}.tabs button.active{background:#2b2b2b;color:#fff}.search,.input{width:100%;height:48px;border:1px solid #292929;background:#101010;color:#fff;border-radius:14px;padding:0 14px;outline:none}.workout{background:#151515;border:1px solid #222;border-radius:20px;padding:15px;margin:10px 0}.date{font-size:12px;color:var(--red);font-weight:800}.meta{color:var(--muted);font-size:13px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#0d0d0df2;backdrop-filter:blur(20px);border-top:1px solid #222;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:#6e6e6e;font-size:9px;font-weight:700;min-height:48px}.nav button span{display:block;font-size:20px}.nav button.active{color:var(--red)}.screen{display:none}.screen.active{display:block}.btn{width:100%;height:50px;border:0;border-radius:15px;background:var(--red);color:#fff;font-weight:800;margin-top:10px}.secondary{background:#252525}.ghost{background:transparent;border:1px solid #333}.danger{color:#ff746c}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.label{font-size:12px;color:#888;display:block;margin:10px 0 6px}.week-row{display:grid;grid-template-columns:56px 1fr 74px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #242424}.week-row:last-child{border:0}.phase{font-size:11px;padding:5px 7px;border-radius:9px;background:#2a1715;color:#ff756d;font-weight:800;text-align:center;border:0}.rec{border-left:3px solid var(--red);padding:12px;margin:10px 0;background:#121212;border-radius:0 14px 14px 0}.rec.good{border-color:var(--green)}.rec.warn{border-color:var(--yellow)}.exercise-card{padding:15px;margin:12px 0}.exercise-card h3{margin:0 0 2px;font-size:20px}.exercise-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{font-size:11px;padding:5px 8px;border-radius:9px;background:#3b1715;color:#ff746c;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.metric{background:#101010;border-radius:12px;padding:9px;text-align:center}.metric b{display:block;font-size:16px}.metric span{font-size:10px;color:#7f7f7f}.chart{height:170px;position:relative;margin-top:12px;padding:10px 4px 20px;border-bottom:1px solid #343434}.chart svg{width:100%;height:100%;overflow:visible}.legend{display:flex;gap:12px;font-size:10px;color:#777;margin-top:8px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.red{background:var(--red)}.green{background:var(--green)}.yellow{background:var(--yellow)}.recommend{margin-top:10px;background:#111;border-radius:14px;padding:12px}.recommend b{display:block;margin-bottom:4px}.recommend span{color:#aaa;font-size:13px}.small{font-size:12px;color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:#222;border:1px solid #2d2d2d;border-radius:999px;padding:7px 10px;font-size:12px}.row-actions{display:flex;gap:8px;margin-top:12px}.row-actions button{flex:1;height:42px;border:0;border-radius:12px;background:#242424;color:#fff;font-weight:700}.row-actions button.primary{background:var(--red)}.modal-back{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(430px,100%);max-height:90dvh;overflow:auto;background:#161616;border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom))}.grab{width:42px;height:5px;background:#555;border-radius:9px;margin:0 auto 14px}.exercise-line{display:grid;grid-template-columns:1fr 42px;gap:8px;margin:8px 0}.exercise-line button{border:0;border-radius:12px;background:#272727;color:#ff746c}.hidden{display:none!important}@media(min-width:600px){.app{border-left:1px solid #171717;border-right:1px solid #171717}}
</style></head><body><div class="app">
<section id="home" class="screen active"><div class="top"><div><div class="eyebrow">TRAINING SYSTEM</div><h1>Дневник</h1></div><div class="kanji">継続</div></div><div class="summary"><div class="stat"><b id="weekDone">0</b><span>тренировок выполнено за эту неделю</span></div></div><div class="plan-card"><h3>Текущая фаза</h3><div id="currentPhase" class="small"></div><div id="weekRecommendation"></div></div><input id="search" class="search" placeholder="Поиск тренировки или упражнения"><div id="workoutList"></div></section>
<section id="plan" class="screen"><div class="top"><div><div class="eyebrow">PERIODIZATION</div><h1>План</h1></div><div class="kanji">計</div></div><div class="panel"><h3>Мезоцикл</h3><label class="label">Название</label><input id="cycleName" class="input"><div class="grid2"><div><label class="label">Текущая неделя цикла</label><input id="cycleWeek" class="input" type="number" min="1" max="20"></div><div><label class="label">Фаза</label><select id="cyclePhase" class="input"><option value="intro">Втягивающая</option><option value="base">Базовая</option><option value="peak">Пиковая</option><option value="deload">Разгрузка</option></select></div></div><button id="saveCycle" class="btn">Сохранить цикл</button></div><div class="panel"><h3>Запланированные тренировки</h3><div id="weekPlanRows"></div><button id="addPlanned" class="btn secondary">+ Запланировать тренировку</button></div><div class="panel"><h3>Рекомендация на следующую неделю</h3><div id="nextWeekAdvice"></div></div></section>
<section id="templates" class="screen"><div class="top"><div><div class="eyebrow">WORKOUT TEMPLATES</div><h1>Шаблоны</h1></div><div class="kanji">型</div></div><button id="newTemplate" class="btn">+ Новый шаблон</button><div id="templateList"></div></section>
<section id="progress" class="screen"><div class="top"><div><div class="eyebrow">EXERCISE PROGRESSION</div><h1>Прогресс</h1></div><div class="kanji">努力</div></div><div class="tabs"><button class="active" data-metric="weight">Вес</button><button data-metric="volume">Объём</button><button data-metric="best">Лучший подход</button></div><div id="exerciseProgress"></div></section>
<section id="history" class="screen"><div class="top"><div><div class="eyebrow">HISTORY</div><h1>История</h1></div><div class="kanji">力</div></div><div id="historyList"></div></section>
</div><nav class="nav"><button data-go="home" class="active"><span>⌂</span>Главная</button><button data-go="plan"><span>▦</span>План</button><button data-go="templates"><span>型</span>Шаблоны</button><button data-go="progress"><span>↗</span>Прогресс</button><button data-go="history"><span>◷</span>История</button></nav><div id="modal"></div>
<script>
const KEY='workout-journal-v1',PLANKEY='workout-journal-plan-v2',TPLKEY='workout-journal-templates-v2';const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];const iso=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}let data=load(KEY,{workouts:[]});if(!data.workouts)data.workouts=[];let plan=load(PLANKEY,{cycle:{name:'Гипертрофия — 6 недель',week:1,phase:'intro'},planned:[]});plan.cycle=plan.cycle||{name:'Гипертрофия — 6 недель',week:1,phase:'intro'};delete plan.cycle.freq;plan.planned=plan.planned||[];let templates=load(TPLKEY,null)||data.templates||[{id:'t1',name:'Грудь + трицепс',exercises:['Жим лёжа','Жим гантелей под углом','Разгибание рук на блоке']},{id:'t2',name:'Ноги',exercises:['Присед','Румынская тяга','Жим ногами','Сгибание ног']}];const savePlan=()=>localStorage.setItem(PLANKEY,JSON.stringify(plan));const saveTpl=()=>localStorage.setItem(TPLKEY,JSON.stringify(templates));savePlan();saveTpl();let metric='weight';
function weekBounds(offset=0){const n=new Date(),day=(n.getDay()+6)%7;const start=new Date(n);start.setHours(0,0,0,0);start.setDate(n.getDate()-day+offset*7);const end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);return[start,end]}function workoutsInWeek(offset=0){const[a,b]=weekBounds(offset);return data.workouts.filter(w=>{const d=new Date(w.date+'T12:00:00');return d>=a&&d<=b})}function phaseText(p){return{intro:'Втягивающая',base:'Базовая',peak:'Пиковая',deload:'Разгрузка'}[p]||p}function phaseRules(p){return{intro:{txt:'Работай спокойно: 2–3 повтора в запасе. На следующей неделе увеличивай только один параметр — вес или повторения.'},base:{txt:'Основная прогрессия. Если техника и повторы стабильны — добавь 2–5% веса или 1–2 повтора.'},peak:{txt:'Интенсивность выше, объём умеренный. Не добавляй одновременно вес и число подходов.'},deload:{txt:'Разгрузка: снизь рабочий объём примерно на 35–45%, а веса на 10–15%.'}}[p]}
function workoutVolume(w){return (w.exercises||[]).reduce((a,e)=>a+(e.sets||[]).reduce((s,x)=>s+(+x.w||0)*(+x.r||0),0),0)}function renderHome(){q('#weekDone').textContent=workoutsInWeek(0).length;q('#currentPhase').innerHTML=`Неделя ${plan.cycle.week} · ${phaseText(plan.cycle.phase)}`;q('#weekRecommendation').innerHTML=`<div class="rec"><div class="small">${phaseRules(plan.cycle.phase).txt}</div></div>`;const s=q('#search').value.toLowerCase();q('#workoutList').innerHTML=[...data.workouts].sort((a,b)=>b.date.localeCompare(a.date)).filter(w=>!s||(w.name||'').toLowerCase().includes(s)||(w.exercises||[]).some(e=>(e.name||'').toLowerCase().includes(s))).slice(0,8).map(w=>`<div class="workout"><div class="date">${new Date(w.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div><h3>${w.name}</h3><div class="meta">${(w.exercises||[]).length} упражнений · ${Math.round(workoutVolume(w)).toLocaleString()} кг объёма</div></div>`).join('')||'<div class="small">Пока нет тренировок.</div>'}
function renderPlan(){q('#cycleName').value=plan.cycle.name||'';q('#cycleWeek').value=plan.cycle.week||1;q('#cyclePhase').value=plan.cycle.phase||'intro';q('#weekPlanRows').innerHTML=plan.planned.length?plan.planned.map((p,i)=>`<div class="week-row"><b>${p.date?new Date(p.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}):p.day||'—'}</b><div><b>${p.name}</b><div class="small">${p.template?'из шаблона':'ручной план'}</div></div><button class="phase" onclick="removePlanned(${i})">Удалить</button></div>`).join(''):'<div class="small">Пока нет запланированных тренировок.</div>';const current=workoutsInWeek(0),prev=workoutsInWeek(-1);const cv=current.reduce((a,w)=>a+workoutVolume(w),0),pv=prev.reduce((a,w)=>a+workoutVolume(w),0);let extra='';if(prev.length&&current.length){const d=(cv-pv)/Math.max(pv,1);extra=d>.15?'Объём уже заметно вырос относительно прошлой недели — не спеши добавлять ещё.':d<-.2?'Объём снизился. Если это не разгрузка и восстановление хорошее — можно вернуть часть нагрузки.':'Нагрузка меняется умеренно — можно продолжать текущую прогрессию.'}q('#nextWeekAdvice').innerHTML=`<div class="rec ${plan.cycle.phase==='deload'?'good':''}"><b>${phaseText(plan.cycle.phase)}</b><div class="small">${phaseRules(plan.cycle.phase).txt}${extra?' '+extra:''}</div></div>`}
window.removePlanned=i=>{plan.planned.splice(i,1);savePlan();renderPlan()};
function openPlanManual(prefill){const t=prefill||{};q('#modal').innerHTML=`<div class="modal-back"><div class="sheet"><div class="grab"></div><h2>Запланировать тренировку</h2><label class="label">Дата</label><input id="pDate" class="input" type="date" value="${t.date||iso(new Date())}"><label class="label">Название</label><input id="pName" class="input" value="${t.name||''}"><button id="pSave" class="btn">Сохранить</button><button id="pCancel" class="btn secondary">Отмена</button></div></div>`;q('#pCancel').onclick=()=>q('#modal').innerHTML='';q('#pSave').onclick=()=>{const name=q('#pName').value.trim();if(!name)return;plan.planned.push({date:q('#pDate').value,name,template:t.template||null});savePlan();q('#modal').innerHTML='';renderPlan()}}
function renderTemplates(){q('#templateList').innerHTML=templates.map((t,i)=>`<div class="template-card"><div class="exercise-head"><div><h3>${t.name}</h3><div class="small">${t.exercises.length} упражнений</div></div><span class="badge">ШАБЛОН</span></div><div class="chips">${t.exercises.map(e=>`<span class="chip">${e}</span>`).join('')}</div><div class="row-actions"><button onclick="editTemplate(${i})">Изменить</button><button class="primary" onclick="useTemplate(${i})">В план</button></div><button class="btn ghost danger" onclick="deleteTemplate(${i})">Удалить</button></div>`).join('')||'<div class="small">Шаблонов пока нет.</div>'}
window.deleteTemplate=i=>{if(confirm('Удалить шаблон?')){templates.splice(i,1);saveTpl();renderTemplates()}};window.useTemplate=i=>{const t=templates[i];openPlanManual({name:t.name,template:t.id})};window.editTemplate=i=>openTemplateEditor(i);
function openTemplateEditor(index=null){const t=index===null?{name:'',exercises:['']}:JSON.parse(JSON.stringify(templates[index]));q('#modal').innerHTML=`<div class="modal-back"><div class="sheet"><div class="grab"></div><h2>${index===null?'Новый шаблон':'Изменить шаблон'}</h2><label class="label">Название</label><input id="tName" class="input" value="${t.name.replace(/"/g,'&quot;')}"><div id="tExercises"></div><button id="addEx" class="btn secondary">+ Добавить упражнение</button><button id="saveT" class="btn">Сохранить шаблон</button><button id="cancelT" class="btn secondary">Отмена</button></div></div>`;let ex=[...t.exercises];const redraw=()=>{q('#tExercises').innerHTML=ex.map((e,j)=>`<div class="exercise-line"><input class="input tEx" data-i="${j}" value="${e.replace(/"/g,'&quot;')}" placeholder="Название упражнения"><button onclick="removeEx(${j})">×</button></div>`).join('');qa('.tEx').forEach(inp=>inp.oninput=()=>ex[+inp.dataset.i]=inp.value)};window.removeEx=j=>{ex.splice(j,1);if(!ex.length)ex.push('');redraw()};redraw();q('#addEx').onclick=()=>{ex.push('');redraw()};q('#cancelT').onclick=()=>q('#modal').innerHTML='';q('#saveT').onclick=()=>{const name=q('#tName').value.trim(),clean=ex.map(x=>x.trim()).filter(Boolean);if(!name||!clean.length)return alert('Добавь название и хотя бы одно упражнение');const obj={id:index===null?'t'+Date.now():templates[index].id,name,exercises:clean};if(index===null)templates.unshift(obj);else templates[index]=obj;saveTpl();q('#modal').innerHTML='';renderTemplates()}}
function histories(){const map={};data.workouts.forEach(w=>(w.exercises||[]).forEach(e=>{(map[e.name]??=[]).push({date:w.date,sets:e.sets||[]})}));return map}function bestWeight(h){return Math.max(0,...h.flatMap(x=>x.sets.map(s=>+s.w||0)))}function bestSet(h){let best={w:0,r:0,score:0};h.forEach(x=>x.sets.forEach(s=>{const sc=(+s.w||0)*(+s.r||0);if(sc>best.score)best={w:+s.w||0,r:+s.r||0,score:sc}}));return best}function histVolume(x){return x.sets.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0)}function points(h,type){const arr=h.sort((a,b)=>a.date.localeCompare(b.date)).slice(-8);return arr.map(x=>type==='weight'?Math.max(0,...x.sets.map(s=>+s.w||0)):type==='volume'?histVolume(x):Math.max(0,...x.sets.map(s=>(+s.w||0)*(+s.r||0))))}function svgLine(vals){if(vals.length<2)return'<div class="small">Нужно минимум 2 тренировки для графика.</div>';const W=330,H=130,min=Math.min(...vals),max=Math.max(...vals),rng=max-min||1;const pts=vals.map((v,i)=>`${10+i*(W-20)/(vals.length-1)},${H-10-(v-min)/rng*(H-25)}`).join(' ');return`<svg viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g>${pts.split(' ').map(p=>{const[x,y]=p.split(',');return`<circle cx="${x}" cy="${y}" r="4" fill="#ff3b30"/>`}).join('')}</g></svg>`}function exerciseAdvice(h){const arr=[...h].sort((a,b)=>a.date.localeCompare(b.date));if(arr.length<2)return'Собери ещё одну тренировку — тогда появится рекомендация по прогрессии.';const a=arr[arr.length-2],b=arr[arr.length-1],bw=Math.max(...b.sets.map(s=>+s.w||0)),aw=Math.max(...a.sets.map(s=>+s.w||0)),bv=histVolume(b),av=histVolume(a);if(plan.cycle.phase==='deload')return'Сейчас разгрузка: снизь объём и не преследуй рекорд.';if(bw>aw&&bv>=av*.9)return'Прогресс идёт: закрепи этот вес или добавь 1 повтор в рабочих подходах.';if(bv>av*1.08)return'Объём вырос. Следующий шаг — сохранить объём и аккуратно добавить 2–5% веса.';return'Нагрузка стабильна. При хорошем восстановлении добавь 1–2 повтора или небольшой шаг веса.'}
function renderProgress(){const map=histories();q('#exerciseProgress').innerHTML=Object.entries(map).map(([name,h])=>{const vals=points(h,metric),bs=bestSet(h),last=[...h].sort((a,b)=>a.date.localeCompare(b.date)).at(-1);return`<div class="exercise-card"><div class="exercise-head"><div><h3>${name}</h3><div class="small">${h.length} тренировок</div></div><span class="badge">${bestWeight(h)} кг</span></div><div class="metrics"><div class="metric"><b>${bestWeight(h)}</b><span>макс. вес</span></div><div class="metric"><b>${Math.round(histVolume(last))}</b><span>посл. объём</span></div><div class="metric"><b>${bs.w}×${bs.r}</b><span>лучший сет</span></div></div><div class="chart">${svgLine(vals)}</div><div class="legend"><span><i class="dot red"></i>${metric==='weight'?'рабочий вес':metric==='volume'?'объём':'лучший подход'}</span></div><div class="recommend"><b>Следующая тренировка</b><span>${exerciseAdvice(h)}</span></div></div>`}).join('')||'<div class="small">Добавь тренировки, чтобы увидеть прогрессию.</div>'}
function renderHistory(){q('#historyList').innerHTML=[...data.workouts].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="workout"><div class="date">${w.date}</div><h3>${w.name}</h3><div class="meta">${(w.exercises||[]).map(e=>e.name).join(' · ')}</div></div>`).join('')||'<div class="small">История пока пустая.</div>'}
function go(id){qa('.screen').forEach(x=>x.classList.toggle('active',x.id===id));qa('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===id));if(id==='home')renderHome();if(id==='plan')renderPlan();if(id==='templates')renderTemplates();if(id==='progress')renderProgress();if(id==='history')renderHistory()}qa('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));q('#search').oninput=renderHome;qa('[data-metric]').forEach(b=>b.onclick=()=>{metric=b.dataset.metric;qa('[data-metric]').forEach(x=>x.classList.toggle('active',x===b));renderProgress()});q('#saveCycle').onclick=()=>{plan.cycle={name:q('#cycleName').value||'Мезоцикл',week:+q('#cycleWeek').value||1,phase:q('#cyclePhase').value};savePlan();renderPlan();renderHome()};q('#addPlanned').onclick=()=>openPlanManual();q('#newTemplate').onclick=()=>openTemplateEditor();renderHome();
</script></body></html>
